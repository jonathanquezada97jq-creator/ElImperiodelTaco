<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="El Imperio del Taco"><meta name="theme-color" content="#c2410c"><title>El Imperio del Taco</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#6b6a64;--bd:#ddd9cf;--ac:#c2410c;--g:#16a34a;--y:#d97706;--r:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--tx:#f0efea;--mu:#9d9b93;--bd:#37373d}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--tx:#f0efea;--mu:#9d9b93;--bd:#37373d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;padding:10px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.top button{font-size:16px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:11px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;font-size:15px;cursor:pointer;width:100%;margin-top:10px}
.btn.s{background:var(--g)}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.x{width:auto;margin:0;padding:4px 9px;background:none;color:var(--mu);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mu)}
.sc{overflow-x:auto}
.in{color:var(--g);font-weight:600}.out{color:var(--r);font-weight:600}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;color:#fff;font-size:12px;font-weight:600}
.sum{display:flex;gap:8px;margin:8px 0}.sum div{flex:1;background:var(--bg);border-radius:8px;padding:8px;text-align:center}.sum b{display:block;font-size:17px}
.mu{color:var(--mu);font-size:13px}
.w.home{max-width:1300px}
.rxcat{display:flex;align-items:center;gap:8px;margin:16px 2px 6px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
.rxcat span{background:var(--bd);color:var(--tx);border-radius:99px;padding:1px 8px;font-size:11px;letter-spacing:0}
.rxrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin:0 0 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer}
.rxrow:active{background:var(--bg)}
.rxrow b{font-size:16px}
.rxpr{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}.rxpr span{color:var(--mu);font-size:22px;font-weight:400}
.rxno{color:var(--y);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:22vh;padding:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;cursor:pointer;font:inherit;text-align:center}
.tile:active{background:var(--ac);color:#fff}
.tile .ic{font-size:46px;line-height:1}.tile b{font-size:19px}.tile .sb{color:var(--mu);font-size:13px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;background:var(--bg);padding:6px 0 10px}
.bar .btn{width:auto;margin:0;padding:11px 16px;flex:none}.bar b{font-size:20px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}.tile{min-height:24vh}.tile .ic{font-size:58px}.tile b{font-size:22px}}
#lock{max-width:340px;margin:12vh auto;text-align:center}
.msg{color:var(--r);font-size:13px;min-height:18px}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}.pw{-webkit-text-security:disc;text-security:disc}
@media(min-width:768px){body{font-size:17px}.w{max-width:980px;padding:22px}h1{font-size:28px}input,select{padding:14px;font-size:17px}.tabs button{padding:15px;font-size:17px}.btn{padding:15px;font-size:17px}th,td{padding:11px 7px;font-size:16px}.sum b{font-size:22px}}
.pos{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:768px){.pos{grid-template-columns:1.3fr 1fr}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.pb{padding:16px 6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:20px;padding:8px 0}
.btn:disabled{opacity:.4}
.q{display:inline-flex;gap:8px;align-items:center}.q button{width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
#rcpt{display:none}
@media print{html,body{background:#fff!important}.w{display:none!important}#rcpt{display:block!important;margin:0 auto;color:#000;font:12px/1.4 monospace}#rcpt hr{border:0;border-top:1px dashed #000}@page{margin:3mm}}
</style></head><body>
<div class="w" id="app"></div><div id="rcpt"></div>

  var T=curT(),warn=T?'':'<div class="card" style="border-color:var(--y)"><b>El turno está cerrado</b><p class="mu" style="margin:4px 0 0">'+(role==='admin'?'Se pueden crear órdenes, pero para cobrar primero abre el turno en la pestaña Turno.':'Se pueden crear órdenes, pero para cobrar el administrador debe abrir el turno.')+'</p></div>';
  if(pay&&ctk())return vPay();
  pay=null;
  if(rc)return vDone();
  curTk=ctk();
  if(!curTk){pcat=null;return warn+vTickets()}
  return warn+vTicket()}
/* --- Tickets abiertos (compartidos entre tablets) --- */
function openTks(){return S.tickets.filter(function(t){return !t.cx})}
function ctk(){if(!curTk)return null;return S.tickets.filter(function(x){return x.id===curTk.id&&!x.cx})[0]||null}
function catOf(p){return (p.cat||'').trim()||'Otros'}
var showHid=false;
function vis(p){return !p.hid||(role==='admin'&&showHid)}
function cats(){var m={},o=[];S.prods.forEach(function(p){if(!vis(p))return;var c=catOf(p);if(!m[c]){m[c]={n:c,k:0};o.push(m[c])}m[c].k++});return o}
function catList(){return '<datalist id="dcat">'+cats().map(function(c){return '<option value="'+esc(c.n)+'">'}).join('')+'</datalist>'}
function setCat(i,v){S.prods[i].cat=(v||'').trim();save();render()}
function tkTot(t){return n(t.items.reduce(function(a,l){return a+l.c*l.pr},0))}
function vTickets(){
  var l=openTks().sort(function(a,b){return b.tk-a.tk});
  return '<div class="card">'+(can('po')?'<b>＋ Nuevo ticket</b><div class="tabs" id="nbar" style="margin:8px 0 0">'+[['aqui','🍽 Comer aquí'],['llevar','🥡 Para llevar'],['domicilio','🛵 Domicilio'],['recoger','🛍 Pasar a recoger']].map(function(x){return '<button style="background:var(--ac);color:#fff;border-color:var(--ac)" onclick="newTk(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>':'')+'<button class="btn o" onclick="doSync()">↻ Actualizar tickets</button></div>'+
  '<div class="card"><b>Tickets abiertos ('+l.length+')</b>'+(l.length?l.map(function(t){
    var q=t.items.reduce(function(a,x){return a+x.c},0);
    return '<div style="padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="openTk('+t.id+')"><div style="display:flex;justify-content:space-between;gap:8px"><b>#'+t.tk+' · '+tl(t.tipo)+(t.ref?' · '+esc(t.ref):'')+'</b><b>'+money(tkTot(t))+'</b></div><div class="mu">'+esc(t.mesero||'')+' · abierto '+t.t+' · '+q+' productos</div></div>'}).join(''):'<p class="mu">No hay tickets abiertos.'+(can('po')?' Toca “Nuevo ticket” para empezar.':'')+'</p>')+'</div>'}
async function newTk(tipo){if(!can('po'))return;tipo=tipo||'aqui';
  if(newTk.busy)return;newTk.busy=1;var b=$('nbar');if(b)b.style.opacity='.5';
  var ov=document.createElement('div');ov.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:98;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:bold';ov.textContent='Creando ticket…';document.body.appendChild(ov);
  var tk;try{tk=await getTk()}finally{newTk.busy=0;try{ov.parentNode.removeChild(ov)}catch(e){}}
  var t={id:nid(),tk:tk,f:today(),t:nowt(),tipo:tipo,ref:'',nota:'',mesero:uname,items:[]};
  S.tickets.push(t);curTk=t;pcat=null;save();render()}

  if(co&&role==='admin'&&S.prods.some(function(p){return p.hid}))left+='<button class="btn o" style="margin-top:10px" onclick="showHid=!showHid;pcat=null;render()">'+(showHid?'🙈 Volver a ocultar los productos ocultos':'👁 Mostrar productos ocultos ('+S.prods.filter(function(p){return p.hid}).length+')')+'</button>';
  var ch=t.items.length?t.items.map(function(l,i){return '<div class="row" style="align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)"><div>'+esc(l.n)+'<br><span class="mu">'+money(l.pr)+((l.pc||0)>0?' · 🔒 '+l.pc+' enviado'+(l.pc>1?'s':'')+' a cocina':'')+'</span></div>'+(co?'<div class="q" style="flex:none"><button onclick="qC('+i+',-1)">−</button><b>'+l.c+'</b><button onclick="qC('+i+',1)">＋</button></div>':'<div style="flex:none"><b>× '+l.c+'</b></div>')+'<div style="text-align:right;flex:none;min-width:70px"><b>'+money(l.c*l.pr)+'</b></div></div>'}).join(''):'<p class="mu">'+(co?'Elige una categoría y toca un producto para agregarlo.':'El ticket no tiene productos.')+'</p>';
  if(rmAsk&&rmAsk.id===t.id)ch+='<div style="margin-top:10px;padding:10px;border:1px solid var(--r);border-radius:8px"><b>Quitar «'+esc(rmAsk.n)+'»</b><p class="mu">Ya se mandó a cocina. Para quitarlo necesitas el código del administrador.</p><input id="rmp" type="text" class="pw" autocomplete="off" inputmode="numeric" placeholder="PIN del administrador"><div class="msg" id="rmm"></div><button class="btn" style="background:var(--r)" onclick="rmOk()">Quitar 1</button><button class="btn o" onclick="rmNo()">Cancelar</button></div>';
  var info=co?otypeHtml():'<div class="mu" style="margin:8px 0">'+tl(t.tipo)+(t.ref?' · '+esc(refLabel(t.tipo))+': '+esc(t.ref):'')+(t.nota?'<br>Nota: '+esc(t.nota):'')+'</div>';
  return '<div class="pos"><div class="card">'+left+'</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Ticket #'+t.tk+'</b><span class="mu">'+esc(t.mesero||'')+' · '+t.t+'</span></div>'+info+ch+'<div class="tot"><span>Total</span><b>'+money(tot)+'</b></div>'+
  (cc?'<button class="btn s" onclick="goPay()"'+(tot>0?'':' disabled')+'>Cerrar ticket y cobrar '+money(tot)+'</button>':'')+
  (co?'<button class="btn'+(cc?'':' s')+'" onclick="printCmd(ctk())"'+(tot>0?'':' disabled')+'>🖨 Comanda a cocina</button>':'')+
  '<button class="btn o" onclick="leaveTk()">'+(co?'Guardar y dejar abierto':'← Volver a la lista')+'</button>'+
  (isDev&&t.mesero==='Developer'?'<button class="btn o" onclick="devDelTk()">🗑 Eliminar ticket (Developer)</button>':'')+'<button class="btn o" onclick="cancelTk()">Cancelar ticket</button>'+(cxAsk?'<div style="margin-top:10px;padding:10px;border:1px solid var(--r);border-radius:8px"><b>Cancelar ticket</b><input id="cxn" placeholder="Motivo de la cancelación (obligatorio)" style="margin-top:6px"><b style="display:block;margin-top:8px">Código del administrador</b><input id="apin" type="text" class="pw" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" inputmode="numeric" placeholder="PIN del administrador" style="margin-top:6px"><div class="msg" id="cxm"></div><button class="btn" style="background:var(--r)" onclick="doCancel()">Confirmar cancelación</button><button class="btn o" onclick="cxAsk=false;render()">No cancelar</button></div>':'')+'</div></div>'}
function addC(i){var t=ctk(),p=S.prods[i];if(!t||!p||!can('po')||!vis(p))return;var x=t.items.filter(function(l){return l.n===p.n&&l.pr===p.pr})[0];if(x)x.c++;else t.items.push({n:p.n,pr:p.pr,c:1});save();render()}
var rmAsk=null;
function qC(i,d){var t=ctk();if(!t||!t.items[i]||!can('po'))return;var l=t.items[i];
  if(d<0&&(l.pc||0)>0&&l.c+d<l.pc){rmAsk={id:t.id,i:i,n:l.n};render();return}
  rmAsk=null;l.c+=d;if(l.c<=0)t.items.splice(i,1);save();render()}
function rmOk(){var t=ctk(),m=$('rmm'),p=($('rmp')||{}).value||'';if(!t||!rmAsk||rmAsk.id!==t.id)return;
  if(!S.pin||(h(p)!==S.pin&&h(p)!==devH())){m.textContent='Código incorrecto';return}
  var l=t.items[rmAsk.i];rmAsk=null;if(!l){render();return}
  l.c-=1;if(l.pc>l.c)l.pc=Math.max(l.c,0);if(l.c<=0)t.items.splice(t.items.indexOf(l),1);save();render();doSync()}
function rmNo(){rmAsk=null;render()}
function setRef(v){var t=ctk();if(t&&can('po')){t.ref=v;save()}}
function setNota(v){var t=ctk();if(t&&can('po')){t.nota=v;save()}}
function setTipo(x){var t=ctk();if(t&&can('po')){t.tipo=x;save();render()}}

function goPay(){var t=ctk();if(!t||!t.items.length||!can('pc'))return;if(!curT()){alert('El turno está cerrado: pide al administrador que lo abra para poder cobrar');return}if(t.tipo==='domicilio'&&!(t.ref||'').trim()){$('om').textContent='Escribe la dirección y teléfono para el domicilio';return}pay={tot:tkTot(t)};payM='efectivo';recv='';render()}

function prn(html){var r=$('rcpt');r.innerHTML=html;r.style.width=(S.cfg.w==58?'54mm':'74mm');setTimeout(function(){window.print()},80)}
function fx(a,b,bold){return '<div style="display:flex;justify-content:space-between;gap:6px'+(bold?';font-weight:bold':'')+'"><span>'+a+'</span><span>'+b+'</span></div>'}
function resRows(T){var s=tStats(T),c=T.ci;return [['Cajero',T.u||'—'],['Apertura',T.ab.f+' '+T.ab.t],['Efectivo inicial',money(T.fondo)],['Ventas en efectivo',money(s.ef)],['Ventas con tarjeta',money(s.tj)],['Ventas por transferencia',money(s.tr)],['Total de ventas',money(s.tot)],['Tickets',s.nt],['Ingresos de caja',money(s.ing)],['Retiros de caja',money(s.ret)],['Efectivo esperado',money(s.esp)],['TOTAL DEL TURNO',money(s.tot)]].concat(c?[['Cierre',c.f+' '+c.t],['Efectivo contado',money(c.contado)],['Diferencia',money(c.dif)]]:[])}
function resHtml(T){var b=byItem(tStats(T).vs);return '<div style="text-align:center"><b style="font-size:15px">El Imperio del Taco</b><br>Resumen de turno</div><hr>'+resRows(T).map(function(r){return fx(r[0],r[1])}).join('')+'<hr><b>Venta por artículo</b>'+b.map(function(o){return fx(o.c+' x '+esc(o.p),money(o.t))}).join('')+'<br>'}

/* --- Impresión: RawBT (Android) / Bluetooth directo / diálogo del navegador. Se guarda por equipo. --- */
var PM='';try{PM=localStorage.getItem('inv_prn')||''}catch(e){}
if(!PM)PM=/Android/i.test(navigator.userAgent)?'rawbt':'nav';
function setPM(v){PM=v;try{localStorage.setItem('inv_prn',v)}catch(e){}render()}
function colsW(){return S.cfg.w==58?32:48}
var MAPC={'á':0xA0,'é':0x82,'í':0xA1,'ó':0xA2,'ú':0xA3,'ñ':0xA4,'Ñ':0xA5,'¿':0xA8,'¡':0xAD,'ü':0x81,'É':0x90};
function ebytes(s){var o=[];String(s).split('').forEach(function(ch){var c=ch.charCodeAt(0);if(MAPC[ch]!==undefined)o.push(MAPC[ch]);else if(c<128)o.push(c);else{var d=ch.normalize('NFD').charCodeAt(0);o.push(d<128?d:63)}});return o}
function EP(){var b=[0x1B,0x40,0x1B,0x74,0x00],o={
  t:function(s){ebytes(s).forEach(function(x){b.push(x)});return o},
  nl:function(k){for(var i=0;i<(k||1);i++)b.push(10);return o},
  al:function(a){b.push(0x1B,0x61,a);return o},
  sz:function(w,hh){b.push(0x1D,0x21,((w-1)<<4)|(hh-1));return o},
  bd:function(on){b.push(0x1B,0x45,on?1:0);return o},
  cut:function(){o.nl(5);return o},   // la PT-210 no tiene cortador: solo avanza papel (el comando de corte podía hacer que la impresora se comiera lo siguiente)
  b:b};return o}
function lnW(){return new Array(colsW()+1).join('-')}
function lr(a,c){var sp=colsW()-a.length-c.length;return a+(sp>0?new Array(sp+1).join(' '):' ')+c}
function cmdTot(o){var t=0;o.items.forEach(function(i){t+=(i.c||0)*(i.pr||0)});return Math.round(t*100)/100}
function cmdBytes(o){
  var e=EP(),ln=lnW(),eq=new Array(colsW()+1).join('=');
  e.t(eq).nl().al(1).sz(2,2).bd(1).t('COMANDA #'+o.tk).nl().sz(1,2).t(tl(o.tipo).toUpperCase()).nl().sz(1,1).bd(0);
  if(o.ref)e.sz(o.tipo==='aqui'?2:1,2).bd(1).t(refLabel(o.tipo)+': '+o.ref).nl().sz(1,1).bd(0);
  e.t(o.f+' '+o.t+(o.mesero?' '+o.mesero:'')).nl().al(0).t(ln).nl();
  o.items.forEach(function(i){e.sz(1,2).bd(1).t(i.c+' x '+i.n).nl()});
  e.sz(1,1).bd(0);
  e.t(ln).nl().sz(1,2).bd(1).t(lr('TOTAL',money(cmdTot(o)))).nl().sz(1,1).bd(0);
  if(o.nota)e.t(ln).nl().bd(1).t('NOTA: ').bd(0).t(o.nota).nl();
  e.t(ln).nl().t(eq).cut();return e.b}
function resBytes(T){
  var e=EP(),ln=lnW();
  e.al(1).bd(1).t('El Imperio del Taco').nl().bd(0).t('Resumen de turno').nl().al(0).t(ln).nl();
  resRows(T).forEach(function(r){e.t(lr(String(r[0]),String(r[1]))).nl()});
  e.t(ln).nl().bd(1).t('Venta por articulo').nl().bd(0);
  byItem(tStats(T).vs).forEach(function(o){e.t(lr(o.c+' x '+o.p,money(o.t))).nl()});
  e.cut();return e.b}
function testBytes(){var e=EP();e.al(1).sz(2,2).bd(1).t('El Imperio').nl().t('del Taco').nl().sz(1,1).bd(0).nl().t('Prueba de impresion OK').nl().t('Acentos: á é í ó ú ñ ¿ ¡').nl().al(0).t(lnW()).cut();return e.b}
function pl(p){return {efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia'}[p]||'—'}
function refLabel(t){return {aqui:'MESA',domicilio:'DIRECCIÓN',recoger:'CLIENTE',llevar:'CLIENTE'}[t]||'REF'}
function reciboBytes(o){
  var e=EP(),ln=lnW();
  e.al(1).sz(2,2).bd(1).t('El Imperio').nl().t('del Taco').nl().sz(1,1).bd(0).nl().t('Ticket de venta #'+o.tk).nl().t(o.f+' '+o.t).nl().al(0).t(ln).nl();
  e.t(tl(o.tipo)+(o.ref?' - '+refLabel(o.tipo)+': '+o.ref:'')).nl();
  if(o.mesero)e.t('Atendio: '+o.mesero).nl();
  e.t(ln).nl();
  o.items.forEach(function(i){e.t(lr(i.c+' x '+i.n,money(i.c*i.pr))).nl()});
  e.t(ln).nl().sz(1,2).bd(1).t(lr('TOTAL',money(o.tot))).nl().sz(1,1).bd(0);
  e.t(lr('Forma de pago',pl(o.pago))).nl();
  if(o.pago==='efectivo'&&o.recv!==undefined){e.t(lr('Recibido',money(o.recv))).nl().t(lr('Cambio',money(o.cambio))).nl()}
  e.nl().al(1).t(S.cfg.msg||'¡Gracias por su compra!').nl().cut();return e.b}
function reciboHtml(o){
  return '<div style="text-align:center"><b style="font-size:16px">El Imperio del Taco</b><br>Ticket de venta #'+o.tk+'<br>'+o.f+' '+o.t+'</div><hr>'+fx(tl(o.tipo),o.ref?esc(refLabel(o.tipo))+': '+esc(o.ref):'')+(o.mesero?'<div>Atendió: '+esc(o.mesero)+'</div>':'')+'<hr>'+o.items.map(function(i){return fx(i.c+' x '+esc(i.n),money(i.c*i.pr))}).join('')+'<hr>'+fx('TOTAL',money(o.tot),true)+fx('Forma de pago',pl(o.pago))+(o.pago==='efectivo'&&o.recv!==undefined?fx('Recibido',money(o.recv))+fx('Cambio',money(o.cambio)):'')+'<br><div style="text-align:center">'+esc(S.cfg.msg||'¡Gracias por su compra!')+'</div><br>'}
function printRecibo(o){if(!o)return;if(PM==='nav')prn(reciboHtml(o));else sendBytes(reciboBytes(o))}

var BTc=null;
async function btPrint(by){
  try{
    if(!navigator.bluetooth){alert('Este navegador no permite Bluetooth directo. Usa el modo RawBT.');return}
    if(!BTc){
      var d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb']});
      var sv=await d.gatt.connect(),ss=await sv.getPrimaryServices();
      for(var i=0;i<ss.length&&!BTc;i++){var cs=await ss[i].getCharacteristics();for(var j=0;j<cs.length;j++){if(cs[j].properties.write||cs[j].properties.writeWithoutResponse){BTc=cs[j];break}}}
      if(!BTc){alert('No encontré cómo escribir en esa impresora (casi seguro es Bluetooth clásico). Usa el modo RawBT.');return}
      d.addEventListener('gattserverdisconnected',function(){BTc=null})
    }
    for(var k=0;k<by.length;k+=60){var ch=new Uint8Array(by.slice(k,k+60));if(BTc.properties.writeWithoutResponse)await BTc.writeValueWithoutResponse(ch);else await BTc.writeValue(ch);await new Promise(function(r){setTimeout(r,45)})}
  }catch(e){BTc=null;alert('No se pudo imprimir: '+((e&&e.message)||e))}}

  (T.cj||[]).forEach(function(m){if(m.tipo==='ingreso')ing+=m.monto;else ret+=m.monto});
  return {tot:n(tot),ef:n(ef),tj:n(tj),tr:n(tr),nt:Object.keys(tk).length,ing:n(ing),ret:n(ret),esp:n(T.fondo+ef+ing-ret),vs:vs}}

var RXF={g:1,gramos:1,kg:1000,libras:453.592,ml:1,litros:1000,oz:29.5735,onzas:29.5735},RXC={pz:1,unidades:1},RXU={g:'gramos',oz:'onzas',ml:'ml',pz:'unidades'};

    if(yb&&qb&&yb.d===qb.d&&yb.v>0){var f=qb.v/yb.v;(pp.ing||[]).forEach(function(g){if(g.n&&g.q>0)rxExpand(g.n,g.q*f,g.u,acc,dep+1)})}else acc.bad[nm]=1;return}

function rxRows(){
  var a=rxArr()||[];
  return (a.length?'<div class="mu" style="display:flex;gap:8px;padding:0 0 4px"><span style="flex:3">Ingrediente</span><span style="flex:1.3">Cantidad</span><span style="flex:1.2">Unidad</span><span style="width:34px"></span></div>':'')+a.map(function(x,j){return '<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><div class="row" style="align-items:center"><input list="dri" value="'+esc(x.n)+'" placeholder="Ingrediente" onchange="rxSet('+j+',\'n\',this.value);render()" style="flex:3"><input type="number" inputmode="decimal" step="any" min="0" value="'+(x.q||'')+'" placeholder="Cant." onchange="rxSet('+j+',\'q\',this.value)" style="flex:1.3"><select style="flex:1.2" onchange="rxSet('+j+',\'u\',this.value);render()">'+['g|g','oz|oz','ml|ml','pz|pz'].map(function(o){var p=o.split('|');return '<option value="'+p[0]+'"'+(x.u===p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')+'</select><button class="btn x" style="flex:none" onclick="rxDel('+j+')">✕</button></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap"><span class="mu">'+esc(rxInfo(x))+'</span>'+(rxSel!==null?'<select style="width:auto;max-width:100%;padding:5px 8px;font-size:13px" onchange="rxSet('+j+',\'w\',this.value)"><option value="t"'+(!x.w?' selected':'')+'>Se usa en todas las órdenes</option><option value="a"'+(x.w==='a'?' selected':'')+'>Solo comer aquí</option><option value="l"'+(x.w==='l'?' selected':'')+'>Solo para llevar, recoger o domicilio</option></select>':'')+'</div></div>'}).join('')+(a.length?'':'<p class="mu">Aún no tiene ingredientes.</p>')}
function rxEditPrep(i){
  var p=rxPreps()[i];
  return '<div class="card"><b>Preparación</b><p class="mu">Una receta base que se usa dentro de otras (ej. el chimol). Cuando un producto lleva «'+esc(p.n)+'», se descuentan sus ingredientes en proporción a lo que rinde.</p><label>Nombre (igual a como aparece en la receta del producto)</label><input value="'+esc(p.n)+'" onchange="rxPN(this.value)"><div class="row"><div><label>Rinde (cantidad total)</label><input type="number" inputmode="decimal" step="any" value="'+(p.y||'')+'" onchange="rxPY(this.value)"></div><div><label>Unidad</label><select onchange="rxPU(this.value)">'+['g|g','ml|ml','oz|oz','pz|pz'].map(function(o){var q=o.split('|');return '<option value="'+q[0]+'"'+(p.u===q[0]?' selected':'')+'>'+q[1]+'</option>'}).join('')+'</select></div></div><b style="display:block;margin-top:12px">Ingredientes de toda la preparación</b>'+rxRows()+'<button class="btn s" onclick="rxAdd()">＋ Agregar ingrediente</button><button class="btn o" onclick="rxDelPrep()">🗑 Borrar esta preparación</button></div>'}
function rxPN(v){var p=rxPreps()[rxPrep];if(p&&v.trim()){p.n=v.trim();save()}}
function rxPY(v){var p=rxPreps()[rxPrep];if(p){p.y=parseFloat(v)||0;save()}}
function rxPU(v){var p=rxPreps()[rxPrep];if(p){p.u=v;save()}}
function rxNewPrep(){S.cfg.preps=rxPreps().concat([{id:nid(),n:'Nueva preparación',y:1000,u:'g',ing:[]}]);rxPrep=S.cfg.preps.length-1;rxSel=null;save();render()}
function rxDelPrep(){if(!confirm('¿Borrar esta preparación?'))return;S.cfg.preps=rxPreps().filter(function(x,i){return i!==rxPrep});rxPrep=null;save();render()}
var RXIMP={
 asada:[['Tortilla',4,'pz'],['Carne',80,'g'],['Cilantro',3,'g'],['Cebolla',30,'g'],['Limón',0.25,'pz'],['Refresco',8,'oz']],
 birria:[['Tortilla',4,'pz'],['Carne',80,'g'],['Mix de queso',50,'g'],['Cilantro',3,'g'],['Cebolla',30,'g'],['Limón',0.25,'pz'],['Caldo de birria',4,'oz'],['Refresco',8,'oz']],
 chilaquiles:[['Nachos',110,'g'],['Caldo taquero',230,'g'],['Guacamole',70,'g'],['Crema',30,'g'],['Chimol',100,'g'],['Carne',80,'g']],
 gringa:[['Tortilla de burrito',1,'pz'],['Frijoles',50,'g'],['Guacamole',35,'g'],['Carne',80,'g'],['Queso',50,'g'],['Chimol',50,'g'],['Aderezo',30,'g']],
 nachos:[['Frijoles',150,'g'],['Nachos',110,'g'],['Aderezo',30,'g'],['Carne',80,'g'],['Chimol',100,'g'],['Guacamole',70,'g']],
 birriamen:[['Maruchan',1,'pz'],['Caldo de birria',465,'g'],['Queso',30,'g'],['Carne',80,'g'],['Cilantro',3,'g'],['Cebolla',30,'g'],['Guacamole',35,'g']]};
var RXNOM={asada:'Tacos de asada',birria:'Tacos de birria',chilaquiles:'Chilaquiles',gringa:'Gringa',nachos:'Nachos',birriamen:'Birriamen'};
function rxSeed(){
  if(!confirm('Se cargan las recetas del Imperio en los productos del menú que coincidan por nombre (asada, birria, chilaquiles, gringa, nachos, birriamen) y la preparación Chimol. A los que ya tengan receta se les reemplaza. ¿Continuar?'))return;
  var hit={};
  S.prods.forEach(function(p){var k=rxKey(p.n+' '+(p.cat||'')),r=null;
    if(/birriamen|ramen/.test(k))r='birriamen';else if(/chilaquil/.test(k))r='chilaquiles';else if(/gringa/.test(k))r='gringa';else if(/nacho/.test(k))r='nachos';else if(/birria/.test(k))r='birria';else if(/asada/.test(k))r='asada';
    if(r){p.rec=RXIMP[r].map(function(x){return {n:x[0],q:x[1],u:x[2]}});(hit[r]=hit[r]||[]).push(p.n)}});
  var ch={id:nid(),n:'Chimol',y:1800,u:'g',ing:[['Tomate',1200],['Cebolla',400],['Cilantro',50],['Jugo de limón',120],['Sal',30]].map(function(x){return {n:x[0],q:x[1],u:'g'}})};
  var ps=rxPreps().filter(function(x){return rxKey(x.n)!=='chimol'});ps.push(ch);S.cfg.preps=ps;
  var ok=Object.keys(hit).map(function(k){return RXNOM[k]+' → '+hit[k].join(', ')}),no=Object.keys(RXIMP).filter(function(k){return !hit[k]}).map(function(k){return RXNOM[k]});
  rxMsg='✓ Recetas cargadas: '+(ok.join(' · ')||'ninguna')+(no.length?'. Sin producto parecido en el menú: '+no.join(', ')+' (agrégalas a mano).':'');
  save();render()}
function rxOkL(x){return x.n&&x.q>0}
function rxFld(i,k,v){var p=S.prods[i];if(!p)return;
  if(k==='n'){v=String(v).trim();if(v)p.n=v}else if(k==='pr'){v=parseFloat(v);if(v>=0)p.pr=v}else p.cat=String(v).trim();
  save();render()}
function rxCreate(){
  var nm=($('npn').value||'').trim(),pr=parseFloat($('npp').value),ct=($('npc').value||'').trim(),m=$('npm');
  if(!nm){m.textContent='Escribe el nombre del producto';return}
  if(!(pr>=0)){m.textContent='Escribe el precio';return}
  S.prods.push({id:nid(),n:nm,pr:pr,cat:ct,rec:[]});rxSel=S.prods.length-1;rxNew=false;save();render()}
function rxHide(i){var p=S.prods[i];if(!p)return;if(p.hid)delete p.hid;else p.hid=true;save();render()}
function rxDelProd(i){var p=S.prods[i];if(!p)return;if(!confirm('¿Quitar «'+p.n+'» del menú? También se borra su receta.'))return;S.prods.splice(i,1);rxSel=null;save();render()}
function rxBack(lbl,fn){return '<button class="btn o" style="margin-top:0;width:auto;padding:9px 16px" onclick="'+fn+';render()">← '+lbl+'</button>'}
function rxEditProd(i){
  var p=S.prods[i];
  return '<div class="card"><b>Producto</b><label>Nombre</label><input value="'+esc(p.n)+'" onchange="rxFld('+i+',\'n\',this.value)"><div class="row"><div><label>Precio ($)</label><input type="number" inputmode="decimal" step="any" min="0" value="'+p.pr+'" onchange="rxFld('+i+',\'pr\',this.value)"></div><div><label>Categoría</label><input list="dcat" value="'+esc(p.cat||'')+'" placeholder="Ej: Taco" onchange="rxFld('+i+',\'cat\',this.value)"></div></div><button class="btn o" onclick="rxHide('+i+')">'+(p.hid?'👁 Mostrar en el menú de cobro':'🙈 Ocultar del menú de cobro')+'</button><p class="mu" style="margin:6px 0 0">'+(p.hid?'Está oculto: no sale al crear órdenes, para nadie. Si lo necesitas, en Cobrar el administrador puede tocar «Mostrar productos ocultos».':'Si lo ocultas, deja de salir al crear órdenes, para meseros y cajeros. Solo el administrador puede volver a mostrarlo desde aquí.')+'</p></div>'+
  '<div class="card"><b>Receta</b><p class="mu">Lo que se descuenta del inventario por <b>cada unidad vendida</b>, al cobrar. Si la dejas vacía, este producto no descuenta nada.<br>Unidades: <b>g</b> gramos · <b>oz</b> onzas líquidas · <b>ml</b> mililitros · <b>pz</b> piezas.<br>En cada ingrediente puedes elegir si se usa en <b>todas las órdenes</b>, <b>solo comer aquí</b> (ej. plato) o <b>solo para llevar</b> (ej. bolsa, plástico, envase).</p>'+rxRows()+'<button class="btn s" onclick="rxAdd()">＋ Agregar ingrediente</button></div>'+
  '<button class="btn o" style="color:var(--r)" onclick="rxDelProd('+i+')">🗑 Quitar este producto del menú</button>'}
function rxList(){
  var cats={},ord=[];S.prods.forEach(function(p,i){var c=catOf(p);if(!cats[c]){cats[c]=[];ord.push(c)}cats[c].push(i)});
  return ord.map(function(c){return '<div class="rxcat">'+esc(c)+'<span>'+cats[c].length+'</span></div>'+cats[c].map(function(i){var p=S.prods[i],k=(p.rec||[]).filter(rxOkL).length;return '<button class="rxrow" onclick="rxSel='+i+';render()"><div style="min-width:0"><b>'+esc(p.n)+'</b>'+(p.hid?' <span class="mu">🙈 oculto</span>':'')+'<div class="mu">'+(k?k+' ingrediente'+(k>1?'s':''):'<span class="rxno">Sin receta</span>')+'</div></div><div class="rxpr">'+money(p.pr)+'<span>›</span></div></button>'}).join('')}).join('')}
function rxNewForm(){
  return '<div class="card"><b>Nuevo producto</b>'+catList()+'<label>Nombre</label><input id="npn" placeholder="Ej: Tacos de pastor"><div class="row"><div><label>Precio ($)</label><input id="npp" type="number" inputmode="decimal" step="any" min="0" placeholder="0.00"></div><div><label>Categoría</label><input id="npc" list="dcat" placeholder="Ej: Taco"></div></div><div class="msg" id="npm"></div><button class="btn s" onclick="rxCreate()">Crear y agregar receta →</button><button class="btn o" onclick="rxNew=false;render()">Cancelar</button></div>'}
function vRec(){
  var dl='<datalist id="dri">'+rxOpts().map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist>'+catList();
  if(rxSel!==null&&S.prods[rxSel])return dl+rxBack('Menú y recetas','rxSel=null')+'<div style="height:10px"></div>'+rxEditProd(rxSel);
  if(rxPrep!==null&&rxPreps()[rxPrep])return dl+rxBack('Preparaciones','rxPrep=null')+'<div style="height:10px"></div>'+rxEditPrep(rxPrep);
  rxSel=null;rxPrep=null;
  var seg='<div class="tabs"><button class="'+(rxView==='prod'?'on':'')+'" onclick="rxView=\'prod\';render()">Productos</button><button class="'+(rxView==='prep'?'on':'')+'" onclick="rxView=\'prep\';render()">Preparaciones</button></div>';
  var msg=rxMsg?'<div class="card" style="border-color:var(--g)">'+esc(rxMsg)+'</div>':'';
  if(rxView==='prep')
    return dl+seg+'<div class="card"><b>Preparaciones</b><p class="mu">Una preparación es una receta base que se usa dentro de otras, como el chimol. En la receta de un producto la agregas como un ingrediente más (ej. «Chimol 100 g») y la app descuenta tomate, cebolla, cilantro, limón y sal en proporción.</p>'+
      (rxPreps().length?rxPreps().map(function(p,i){return '<button class="rxrow" onclick="rxPrep='+i+';render()"><div style="min-width:0"><b>'+esc(p.n)+'</b><div class="mu">'+(p.ing||[]).filter(rxOkL).length+' ingredientes</div></div><div class="rxpr">rinde '+(p.y||0)+' '+esc(p.u)+'<span>›</span></div></button>'}).join(''):'<p class="mu">Aún no hay preparaciones.</p>')+'<button class="btn s" onclick="rxNewPrep()">＋ Nueva preparación</button></div>';
  var sin=S.prods.filter(function(p){return !(p.rec||[]).some(rxOkL)}).length;
  return dl+seg+msg+(rxNew?rxNewForm():'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div style="min-width:0"><b>'+S.prods.length+' producto'+(S.prods.length===1?'':'s')+'</b><div class="mu">'+(sin?'<span class="rxno">'+sin+' sin receta</span> · toca un producto para editarlo':'Todos tienen receta · toca uno para editarlo')+'</div></div><button class="btn s" style="width:auto;margin:0;padding:10px 16px" onclick="rxNew=true;render()">＋ Nuevo producto</button></div></div>')+
    (S.prods.length?rxList():'<p class="mu">Aún no hay productos. Toca «Nuevo producto» para crear el primero.</p>')+
    '<div class="card" style="margin-top:14px"><b>Recetas del Imperio</b><p class="mu">Carga de una vez las recetas de asada, birria, chilaquiles, gringa, nachos y birriamen, más la preparación de chimol, en los productos que se llamen igual.</p><button class="btn o" onclick="rxSeed()">⬇ Cargar recetas del Imperio</button></div>'}

/* ====== Menú principal del administrador (cuadrícula) ====== */
var devView='grid';try{devView=localStorage.getItem('inv_dview')==='tabs'?'tabs':'grid'}catch(e){}
function togView(){if(!isDev)return;devView=devView==='tabs'?'grid':'tabs';try{localStorage.setItem('inv_dview',devView)}catch(e){}tab=devView==='tabs'?'pos':'menu';cf='';render()}
var ATIT={pos:'Cobrar',tur:'Turno',ord:'Historial de órdenes',ven:'Venta del día',inv:'Inventario',rec:'Menú y recetas',usr:'Meseros y PIN',prn:'Impresora',dev:'Developer',set:'Ajustes'};
function vHome(){
  var nt=openTks().length;
  var tl2=[['pos','🧾','Cobrar',nt?nt+' ticket'+(nt>1?'s':'')+' abierto'+(nt>1?'s':''):'Nueva orden'],['tur','🕐','Turno',curT()?'Abierto':'Cerrado'],['ord','📋','Historial de órdenes',''],['ven','💰','Venta del día',''],['inv','📦','Inventario',''],['rec','🍽','Menú y recetas',S.prods.length+' productos'],['usr','👥','Meseros y PIN',S.users.length+' meseros'],['prn','🖨','Impresora','']];
  if(isDev)tl2.push(['dev','🛠','Developer','']);
  return '<div class="grid">'+tl2.map(function(x){return '<button class="tile" onclick="setTab(\''+x[0]+'\')"><span class="ic">'+x[1]+'</span><b>'+x[2]+'</b>'+(x[3]?'<span class="sb">'+x[3]+'</span>':'')+'</button>'}).join('')+'</div>'}
function adminBar(){
  if(tab==='menu')return '';
  return '<div class="bar"><button class="btn" onclick="setTab(\'menu\')">← Menú principal</button><b>'+(ATIT[tab]||'')+'</b></div>'}

function editRef(i){var o=OL[i];if(!o||!can('pc'))return;var v=prompt('Nuevo valor para la orden #'+o.tk+' ('+refLabel(o.tipo).toLowerCase()+')',o.ref||'');if(v===null)return;v=v.trim();S.ventas.forEach(function(x){if(x.tk===o.tk&&x.f===o.f)x.ref=v});save();render();doSync()}

/* --- Borrar datos de prueba (solo administrador) --- */
var cf='';
function ask(k){if(!isDev)return;if(cf===k){cf='';if(k==='sales')wipeSales();else if(k==='inv')wipeInv();else if(k.charAt(0)==='t')delTurno(Number(k.slice(1)))}else{cf=k;render()}}
function vClean(){
  function b(k,txt){var on=cf===k;return '<button class="btn '+(on?'':'o')+'"'+(on?' style="background:var(--r)"':'')+' onclick="ask(\''+k+'\')">'+(on?'⚠ ¿Seguro? Toca otra vez para borrar':txt)+'</button>'}
  return '<div class="card"><b>🧹 Borrar datos de prueba</b><p class="mu">Se borran en todas las tablets y en tu hoja de Google, y no se puede deshacer. El menú, los meseros y el PIN no se tocan.</p>'+b('sales','Borrar ventas, órdenes y turnos (y reiniciar el # de orden)')+b('inv','Borrar movimientos de inventario')+'</div>'}
function delTurno(id){S.movs=S.movs.filter(function(m){return !(m.auto&&m.vt===id)});S.turnos=S.turnos.filter(function(x){return x.id!==id});S.ventas=S.ventas.filter(function(v){return v.turno!==id});if(vt===id)vt=null;save();render();doSync()}
async function wipeSales(){S.movs=S.movs.filter(function(m){return !m.auto});S.ventas=[];S.turnos=[];S.tickets=[];curTk=null;S.nTk=0;S.off=0;vt=null;cart=[];pay=null;rc=null;BASE.nk=0;save();render();try{await api({action:'resetnum'})}catch(e){}doSync()}
function wipeInv(){S.movs=[];save();render();doSync()}
load();norm();hd=vd=today();init();
</script></body></html>
