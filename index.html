<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="El Imperio del Taco"><meta name="theme-color" content="#c2410c"><title>El Imperio del Taco</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#6b6a64;--bd:#ddd9cf;--ac:#c2410c;--g:#16a34a;--y:#d97706;--r:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--tx:#f0efea;--mu:#9d9b93;--bd:#37373d}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--tx:#f0efea;--mu:#9d9b93;--bd:#37373d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;padding:10px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.top button{font-size:16px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:11px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;font-size:15px;cursor:pointer;width:100%;margin-top:10px}
.btn.s{background:var(--g)}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.x{width:auto;margin:0;padding:4px 9px;background:none;color:var(--mu);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mu)}
.sc{overflow-x:auto}
.in{color:var(--g);font-weight:600}.out{color:var(--r);font-weight:600}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;color:#fff;font-size:12px;font-weight:600}
.sum{display:flex;gap:8px;margin:8px 0}.sum div{flex:1;background:var(--bg);border-radius:8px;padding:8px;text-align:center}.sum b{display:block;font-size:17px}
.mu{color:var(--mu);font-size:13px}
#lock{max-width:340px;margin:12vh auto;text-align:center}
.msg{color:var(--r);font-size:13px;min-height:18px}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}
@media(min-width:768px){body{font-size:17px}.w{max-width:980px;padding:22px}h1{font-size:28px}input,select{padding:14px;font-size:17px}.tabs button{padding:15px;font-size:17px}.btn{padding:15px;font-size:17px}th,td{padding:11px 7px;font-size:16px}.sum b{font-size:22px}}
.pos{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:768px){.pos{grid-template-columns:1.3fr 1fr}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.pb{padding:16px 6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:20px;padding:8px 0}
.btn:disabled{opacity:.4}
.q{display:inline-flex;gap:8px;align-items:center}.q button{width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
#rcpt{display:none}
@media print{html,body{background:#fff!important}.w{display:none!important}#rcpt{display:block!important;margin:0 auto;color:#000;font:12px/1.4 monospace}#rcpt hr{border:0;border-top:1px dashed #000}@page{margin:3mm}}
</style></head><body>
<div class="w" id="app"></div><div id="rcpt"></div>
<script>
var K='inv_app_v1',S={pin:'',movs:[],ventas:[]},tab='pos',sub='reg',auth=false,hp='day',hd='',vd='',mf='',dl=null,DEV='',OWN=false,DB=null,gate='chk',BK=null,RQ=[],AP=[],bt=null,lastBk='';
function load(){try{var r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}schedBk()}
function h(s){var x=0;s=String(s);for(var i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))|0;return 'p'+x}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function nowt(){return new Date().toTimeString().slice(0,5)}
function n(v){return Math.round(v*100)/100}
function $(i){return document.getElementById(i)}
function names(){var s={};S.movs.forEach(function(m){s[m.p]=1});return Object.keys(s).sort()}
function sales_names(){var s={};S.ventas.forEach(function(m){s[m.p]=1});return Object.keys(s).sort()}
function inRange(f){
  var d=new Date(hd+'T12:00:00');
  if(hp==='day')return f===hd;
  if(hp==='month')return f.slice(0,7)===hd.slice(0,7);
  var dow=(d.getDay()+6)%7,a=new Date(d);a.setDate(d.getDate()-dow);var b=new Date(a);b.setDate(a.getDate()+6);
  return f>=ymd(a)&&f<=ymd(b)}
function rangeLabel(){
  var d=new Date(hd+'T12:00:00');
  if(hp==='day')return hd;if(hp==='month')return hd.slice(0,7);
  var dow=(d.getDay()+6)%7,a=new Date(d);a.setDate(d.getDate()-dow);var b=new Date(a);b.setDate(a.getDate()+6);
  return ymd(a)+' al '+ymd(b)}

/* ---------- Acceso ---------- */
function lockView(){
  var first=!S.pin;
  $('app').innerHTML='<div id="lock" class="card"><h1>'+(first?'Configurar administrador':'Acceso protegido')+'</h1><p class="mu">'+(first?'Este dispositivo quedará autorizado. Crea tu PIN de administrador.':'Ingresa tu PIN (administrador o mesero).')+'</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">'+(first?'<input id="pin2" type="password" inputmode="numeric" placeholder="Repite el PIN" style="margin-top:8px">':'')+'<div class="msg" id="lm"></div><button class="btn" onclick="enter()">'+(first?'Guardar y entrar':'Entrar')+'</button></div>'}
function logout(){auth=false;role='';lockView()}
function pick(v){if(!v)return;$('p').value=v;var l=S.movs.filter(function(m){return m.p===v}).pop();if(l)$('u').value=l.u}

/* ---------- Estructura ---------- */
function render(){
  if(gate!=='ok')return gateView();
  if(!auth)return lockView();
  if(role!=='admin'&&tab!=='pos'&&tab!=='ord'&&tab!=='prn')tab='pos';
  var t=function(id,l,cur,fn){return '<button class="'+(cur===id?'on':'')+'" onclick="'+fn+'(\''+id+'\')">'+l+'</button>'};
  var out='<h1>🌮 El Imperio del Taco <button class="btn x" style="float:right" onclick="logout()">'+esc(uname)+' · Bloquear</button></h1><div class="mu" id="bk" onclick="doSync()" style="margin:-6px 0 8px;cursor:pointer">'+(lastBk?'☁ Sincronizado '+lastBk+' ↻':'')+'</div>'+(BK?'<div class="card">Hay datos respaldados en la nube. <button class="btn s" onclick="restore()">Restaurar datos</button></div>':'')+'<div class="tabs top">'+t('pos','🧾 Cobrar',tab,'setTab')+t('tur','🕐 Turno',tab,'setTab')+t('ord','📋 Historial de órdenes',tab,'setTab')+t('prn','🖨 Impresora',tab,'setTab')+t('ven','💰 Venta del día',tab,'setTab')+t('inv','📦 Inventario',tab,'setTab')+(role==='admin'?t('set','⚙ Ajustes',tab,'setTab'):'')+'</div>';
  if(role!=='admin')out=out.replace(/<button[^>]*setTab\('(ven|inv|tur)'\)[^>]*>.*?<\/button>/g,'');
  if(tab==='inv'){
    out+='<div class="tabs">'+t('reg','1 Registro',sub,'setSub')+t('his','2 Historial',sub,'setSub')+t('mov','3 Movimientos',sub,'setSub')+t('stk','4 Stock',sub,'setSub')+'</div>'+({reg:vReg,his:vHis,mov:vMov,stk:vStk}[sub])();
  }else if(tab==='ord')out+=vOrd();else if(tab==='prn')out+=vPrn();else if(tab==='set')out+=vSet();else if(tab==='pos')out+=vPos();else if(tab==='tur')out+=vTur();else out+=vVen();
  $('app').innerHTML=out}
function setTab(x){tab=x;cf='';render();if(x==='tur'||x==='ord'||x==='pos')doSync()}
function setSub(x){sub=x;render()}
function dlist(){return '<datalist id="dl">'+names().map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist>'}

/* ---------- 1 Registro ---------- */
function vReg(){
  return '<div class="card"><b>Registrar entrada o salida</b>'+dlist()+
  '<label>Elegir un producto ya registrado</label><select onchange="pick(this.value)"><option value="">— Seleccionar —</option>'+names().map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select><label>O escribir uno nuevo</label><input id="p" list="dl" placeholder="Ej: Carne">'+
  '<div class="row"><div><label>Cantidad</label><input id="c" type="number" inputmode="decimal" min="0" step="any"></div><div><label>Unidad</label><select id="u"><option>libras</option><option>unidades</option><option>kg</option><option>litros</option><option>cajas</option><option>bolsas</option></select></div></div>'+
  '<div class="row"><div><label>Fecha</label><input id="f" type="date" value="'+today()+'"></div><div><label>Nota (opcional)</label><input id="nt"></div></div>'+
  '<div class="row"><button class="btn s" onclick="addMov(\'entrada\')">＋ Agregué</button><button class="btn" onclick="addMov(\'salida\')">－ Retiré</button></div><div class="msg" id="rm"></div></div>'+
  '<div class="card"><button class="btn o" style="margin:0" onclick="exportInv()">⬇ Exportar inventario a Excel</button><p class="mu" style="margin:8px 0 0">Todo se guarda automáticamente en cada cambio.</p></div>'}
function addMov(tipo){
  var p=$('p').value.trim(),c=parseFloat($('c').value);
  if(!p||!(c>0)){$('rm').textContent='Escribe el producto y una cantidad mayor a 0';return}
  var ex=names().filter(function(x){return x.toLowerCase()===p.toLowerCase()})[0];if(ex)p=ex;
  S.movs.push({id:Date.now(),f:$('f').value||today(),t:nowt(),p:p,tipo:tipo,c:c,u:$('u').value,nt:$('nt').value.trim()});
  save();render();$('rm').textContent='✓ Guardado: '+(tipo==='entrada'?'entrada':'salida')+' de '+c+' '+p}
function delMov(id){S.movs=S.movs.filter(function(m){return m.id!==id});save();render()}

/* ---------- 2 Historial ---------- */
function vHis(){
  var l=S.movs.filter(function(m){return inRange(m.f)}).sort(function(a,b){return (b.f+b.t)<(a.f+a.t)?-1:1});
  var e=0,s=0;l.forEach(function(m){m.tipo==='entrada'?e+=m.c:s+=m.c});
  return '<div class="card"><div class="tabs">'+['day|Día','week|Semana','month|Mes'].map(function(x){var a=x.split('|');return '<button class="'+(hp===a[0]?'on':'')+'" onclick="hp=\''+a[0]+'\';render()">'+a[1]+'</button>'}).join('')+'</div>'+
  '<input type="date" value="'+hd+'" onchange="hd=this.value||today();render()"><p class="mu">Mostrando: '+rangeLabel()+'</p>'+
  '<div class="sum"><div><b class="in">'+n(e)+'</b>entradas</div><div><b class="out">'+n(s)+'</b>salidas</div><div><b>'+l.length+'</b>registros</div></div>'+movTable(l)+'</div>'}
function movTable(l){
  if(!l.length)return '<p class="mu">Sin movimientos.</p>';
  return '<div class="sc"><table><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th></th></tr>'+l.map(function(m){
    return '<tr><td>'+m.f.slice(5)+'<br><span class="mu">'+m.t+'</span></td><td>'+esc(m.p)+(m.nt?'<br><span class="mu">'+esc(m.nt)+'</span>':'')+'</td><td class="'+(m.tipo==='entrada'?'in':'out')+'">'+(m.tipo==='entrada'?'Entrada':'Salida')+'</td><td>'+m.c+' '+esc(m.u)+'</td><td><button class="btn x" onclick="delMov('+m.id+')">✕</button></td></tr>'}).join('')+'</table></div>'}

/* ---------- 3 Movimientos ---------- */
function vMov(){
  var q=mf.toLowerCase();
  var l=S.movs.filter(function(m){return !q||m.p.toLowerCase().indexOf(q)>-1}).sort(function(a,b){return (b.f+b.t)<(a.f+a.t)?-1:1});
  return '<div class="card"><label style="margin-top:0">Filtrar por nombre del producto</label><input id="mf" value="'+esc(mf)+'" placeholder="Ej: carne" oninput="mf=this.value;rMov()"><div id="mt" style="margin-top:8px">'+movTable(l)+'</div></div>'}
function rMov(){var q=mf.toLowerCase();var l=S.movs.filter(function(m){return !q||m.p.toLowerCase().indexOf(q)>-1}).sort(function(a,b){return (b.f+b.t)<(a.f+a.t)?-1:1});$('mt').innerHTML=movTable(l)}

/* ---------- 4 Stock ---------- */
function stockData(){
  return names().map(function(p){
    var e=0,s=0,u='';
    S.movs.forEach(function(m){if(m.p===p){u=m.u;m.tipo==='entrada'?e+=m.c:s+=m.c}});
    var st=n(e-s),r=e>0?st/e:0,est=(st<=0||r<0.2)?['Bajo stock','var(--r)']:(r<0.5?['Mitad de stock','var(--y)']:['Buen stock','var(--g)']);
    return {p:p,u:u,e:n(e),s:n(s),st:st,est:est}})}
function vStk(){
  var d=stockData();
  return '<div class="card">'+(d.length?d.map(function(x){return '<div style="padding:9px 0;border-bottom:1px solid var(--bd)"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(x.p)+'</b><span class="pill" style="background:'+x.est[1]+'">'+x.est[0]+'</span></div><div class="mu">Total entradas: '+x.e+' '+esc(x.u)+' · Total salidas: '+x.s+' '+esc(x.u)+'</div><div>Stock actual: <b>'+x.st+' '+esc(x.u)+'</b></div></div>'}).join(''):'<p class="mu">Aún no hay productos. Ve a Registro.</p>')+
  '<p class="mu">🟢 Buen stock: más de 50% de lo que ha entrado · 🟡 Mitad: 20%–50% · 🔴 Bajo: menos de 20% o agotado.</p></div>'}

/* ---------- Venta del día ---------- */
function vVen(){
  var l=S.ventas.filter(function(v){return v.f===vd}).sort(function(a,b){return b.id-a.id});
  var tot=0;l.forEach(function(v){tot+=v.c*v.pr});
  var dl='<datalist id="dv">'+sales_names().map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist>';
  return '<div class="card"><b>Registrar venta</b>'+dl+
  '<label>Producto</label><input id="vp" list="dv" placeholder="Ej: Tacos">'+
  '<div class="row"><div><label>Cantidad</label><input id="vc" type="number" inputmode="decimal" min="0" step="any" value="1"></div><div><label>Precio c/u ($)</label><input id="vr" type="number" inputmode="decimal" min="0" step="any"></div></div>'+
  '<button class="btn s" onclick="addVen()">Registrar venta</button><div class="msg" id="vm"></div></div>'+
  '<div class="card"><b>Venta total del día</b><label>Selecciona el día</label><input type="date" value="'+vd+'" onchange="vd=this.value||today();render()">'+
  '<div class="sum"><div><b>$'+n(tot).toFixed(2)+'</b>total del día</div><div><b>'+l.length+'</b>ventas</div></div>'+
  (l.length?'<div class="sc"><table><tr><th>Hora</th><th>Orden</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>Total</th><th></th></tr>'+l.map(function(v){return '<tr><td>'+v.t+'</td><td>'+(v.tk?'<b>#'+v.tk+'</b><br><span class="mu">'+tl(v.tipo)+(v.ref?' · '+esc(v.ref):'')+'</span>':'—')+'</td><td>'+esc(v.p)+'</td><td>'+v.c+'</td><td>$'+v.pr.toFixed(2)+'</td><td><b>$'+n(v.c*v.pr).toFixed(2)+'</b></td><td><button class="btn x" onclick="delVen('+v.id+')">✕</button></td></tr>'}).join('')+'</table></div>':'<p class="mu">Sin ventas ese día.</p>')+
  '<button class="btn o" onclick="exportVen()">⬇ Exportar ventas a Excel</button></div>'+vResumen()}
function addVen(){
  var p=$('vp').value.trim(),c=parseFloat($('vc').value),pr=parseFloat($('vr').value);
  if(!p||!(c>0)||!(pr>=0)){$('vm').textContent='Completa producto, cantidad y precio';return}
  var ex=sales_names().filter(function(x){return x.toLowerCase()===p.toLowerCase()})[0];if(ex)p=ex;
  S.ventas.push({id:Date.now(),f:vd,t:nowt(),p:p,c:c,pr:pr});save();render();$('vm').textContent='✓ Venta guardada'}
function delVen(id){S.ventas=S.ventas.filter(function(v){return v.id!==id});save();render()}

/* ---------- Exportar ---------- */
async function saveXlsx(wb,name){try{XLSX.writeFile(wb,name)}catch(e){alert('No se pudo exportar')}}
function wbInv(){
  var wb=XLSX.utils.book_new();
  var mv=S.movs.slice().sort(function(a,b){return (a.f+a.t)<(b.f+b.t)?-1:1}).map(function(m){return {Fecha:m.f,Hora:m.t,Producto:m.p,Tipo:m.tipo==='entrada'?'Entrada':'Salida',Cantidad:m.c,Unidad:m.u,Nota:m.nt}});
  var st=stockData().map(function(x){return {Producto:x.p,'Total entradas':x.e,'Total salidas':x.s,Stock:x.st,Unidad:x.u,Estado:x.est[0]}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mv.length?mv:[{}]),'Movimientos');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(st.length?st:[{}]),'Stock');
  return wb}
function exportInv(){saveXlsx(wbInv(),'inventario_'+today()+'.xlsx')}
function wbVen(){
  var wb=XLSX.utils.book_new();
  var v=S.ventas.slice().sort(function(a,b){return (a.f+a.t)<(b.f+b.t)?-1:1}).map(function(x){return {Fecha:x.f,Hora:x.t,Orden:x.tk||'',Tipo:x.tipo?tl(x.tipo):'',Referencia:x.ref||'',Mesero:x.mesero||'',Nota:x.nota||'',Pago:x.pago||'',Producto:x.p,Cantidad:x.c,'Precio unitario':x.pr,Total:n(x.c*x.pr)}});
  var by={};S.ventas.forEach(function(x){by[x.f]=(by[x.f]||0)+x.c*x.pr});
  var r=Object.keys(by).sort().map(function(k){return {Fecha:k,'Total del día':n(by[k])}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(v.length?v:[{}]),'Ventas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.length?r:[{}]),'Total por día');
  var bi={};S.ventas.forEach(function(x){var k=x.f+'|'+x.p;bi[k]=bi[k]||{Fecha:x.f,Producto:x.p,Cantidad:0,Total:0};bi[k].Cantidad+=x.c;bi[k].Total=n(bi[k].Total+x.c*x.pr)});
  var ba=Object.keys(bi).sort().map(function(k){return bi[k]});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ba.length?ba:[{}]),'Por articulo');
  var og=ordersOf(S.ventas.filter(function(x){return x.tk})).map(function(o){return {Orden:o.tk,Fecha:o.f,Hora:o.t,Tipo:tl(o.tipo),Referencia:o.ref||'',Mesero:o.mesero||'',Pago:o.pago||'',Total:n(o.tot),Productos:o.items.map(function(i){return i.c+' x '+i.n}).join(', '),Nota:o.nota||''}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(og.length?og:[{}]),'Ordenes');
  var tr=S.turnos.map(function(T){var q=tStats(T),c=T.ci||{};return {Cajero:T.u||'',Apertura:T.ab.f+' '+T.ab.t,Cierre:c.f?c.f+' '+c.t:'abierto','Efectivo inicial':T.fondo,'Ventas efectivo':q.ef,'Ventas tarjeta':q.tj,'Total ventas':q.tot,Tickets:q.nt,Ingresos:q.ing,Retiros:q.ret,Esperado:q.esp,Contado:c.contado===undefined?'':c.contado,Diferencia:c.dif===undefined?'':c.dif}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tr.length?tr:[{}]),'Turnos');
  return wb}
function exportVen(){saveXlsx(wbVen(),'ventas_'+today()+'.xlsx')}

var PM='';try{PM=localStorage.getItem('inv_prn')||''}catch(e){}
if(!PM)PM=/Android/i.test(navigator.userAgent)?'rawbt':'nav';
function setPM(v){PM=v;try{localStorage.setItem('inv_prn',v)}catch(e){}render()}
function colsW(){return S.cfg.w==58?32:48}
var MAPC={'á':0xA0,'é':0x82,'í':0xA1,'ó':0xA2,'ú':0xA3,'ñ':0xA4,'Ñ':0xA5,'¿':0xA8,'¡':0xAD,'ü':0x81,'É':0x90};
function ebytes(s){var o=[];String(s).split('').forEach(function(ch){var c=ch.charCodeAt(0);if(MAPC[ch]!==undefined)o.push(MAPC[ch]);else if(c<128)o.push(c);else{var d=ch.normalize('NFD').charCodeAt(0);o.push(d<128?d:63)}});return o}
function EP(){var b=[0x1B,0x40,0x1B,0x74,0x00],o={
  t:function(s){ebytes(s).forEach(function(x){b.push(x)});return o},
  nl:function(k){for(var i=0;i<(k||1);i++)b.push(10);return o},
  al:function(a){b.push(0x1B,0x61,a);return o},
  sz:function(w,hh){b.push(0x1D,0x21,((w-1)<<4)|(hh-1));return o},
  bd:function(on){b.push(0x1B,0x45,on?1:0);return o},
  cut:function(){o.nl(4);b.push(0x1D,0x56,0x42,0x00);return o},
  b:b};return o}
function lnW(){return new Array(colsW()+1).join('-')}
function lr(a,c){var sp=colsW()-a.length-c.length;return a+(sp>0?new Array(sp+1).join(' '):' ')+c}
function cmdBytes(o){
  var e=EP(),ln=lnW();
  e.al(1).sz(2,2).bd(1).t('COMANDA #'+o.tk).nl().sz(1,2).t(tl(o.tipo).toUpperCase()).nl().sz(1,1).bd(0);
  if(o.ref)e.t(o.ref).nl();
  e.t(o.f+' '+o.t+(o.mesero?' '+o.mesero:'')).nl().al(0).t(ln).nl();
  o.items.forEach(function(i){e.sz(1,2).bd(1).t(i.c+' x '+i.n).nl()});
  e.sz(1,1).bd(0);
  if(o.nota)e.t(ln).nl().bd(1).t('NOTA: ').bd(0).t(o.nota).nl();
  e.t(ln).cut();return e.b}
function resBytes(T){
  var e=EP(),ln=lnW();
  e.al(1).bd(1).t('El Imperio del Taco').nl().bd(0).t('Resumen de turno').nl().al(0).t(ln).nl();
  resRows(T).forEach(function(r){e.t(lr(String(r[0]),String(r[1]))).nl()});
  e.t(ln).nl().bd(1).t('Venta por articulo').nl().bd(0);
  byItem(tStats(T).vs).forEach(function(o){e.t(lr(o.c+' x '+o.p,money(o.t))).nl()});
  e.cut();return e.b}
function testBytes(){var e=EP();e.al(1).sz(2,2).bd(1).t('El Imperio').nl().t('del Taco').nl().sz(1,1).bd(0).nl().t('Prueba de impresion OK').nl().t('Acentos: á é í ó ú ñ ¿ ¡').nl().al(0).t(lnW()).cut();return e.b}
function printCmd(o){if(!o)return;if(PM==='nav')prn(cmdHtml(o));else sendBytes(cmdBytes(o))}
function printRes(T){if(!T)return;if(PM==='nav')prn(resHtml(T));else sendBytes(resBytes(T))}
function printTest(){if(PM==='nav')prn('<div style="text-align:center"><b>El Imperio del Taco</b><br>Prueba de impresión</div><br>');else sendBytes(testBytes())}
function sendBytes(by){if(PM==='rawbt')rawbt(by);else if(PM==='bt')btPrint(by)}
function b64(by){var s='';by.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)}
function rawbt(by){window.location.href='intent:base64,'+b64(by)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'}
var BTc=null;
async function btPrint(by){
  try{
    if(!navigator.bluetooth){alert('Este navegador no permite Bluetooth directo. Usa el modo RawBT.');return}
    if(!BTc){
      var d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb']});
      var sv=await d.gatt.connect(),ss=await sv.getPrimaryServices();
      for(var i=0;i<ss.length&&!BTc;i++){var cs=await ss[i].getCharacteristics();for(var j=0;j<cs.length;j++){if(cs[j].properties.write||cs[j].properties.writeWithoutResponse){BTc=cs[j];break}}}
      if(!BTc){alert('No encontré cómo escribir en esa impresora (casi seguro es Bluetooth clásico). Usa el modo RawBT.');return}
      d.addEventListener('gattserverdisconnected',function(){BTc=null})
    }
    for(var k=0;k<by.length;k+=100){var ch=new Uint8Array(by.slice(k,k+100));if(BTc.properties.writeWithoutResponse)await BTc.writeValueWithoutResponse(ch);else await BTc.writeValue(ch);await new Promise(function(r){setTimeout(r,30)})}
  }catch(e){BTc=null;alert('No se pudo imprimir: '+((e&&e.message)||e))}}

  '<button class="btn s" onclick="printTest()">🖨 Imprimir prueba</button></div>'+
  '<div class="card"><b>Cómo vincular la PT-210 con RawBT</b><p class="mu">1) Instala la app <b>RawBT</b> desde Play Store.<br>2) Enciende la PT-210 y vincúlala en Ajustes → Bluetooth de la tablet (PIN 0000 o 1234).<br>3) Abre RawBT → Ajustes → Impresora → Bluetooth → elige la PT-210 y deja el modo ESC/POS genérico.<br>4) Vuelve aquí, deja el modo RawBT y toca “Imprimir prueba”.</p></div>'}

/* --- Turno --- */
function tStats(T){
  var vs=S.ventas.filter(function(v){return v.turno===T.id}),tot=0,ef=0,tj=0,tk={},ing=0,ret=0;
  vs.forEach(function(v){var m=v.c*v.pr;tot+=m;if(v.pago==='tarjeta')tj+=m;else ef+=m;tk[v.tk]=1});

function buildOps(limit){
  var ops={},cnt=0,more=false;
  COLS.forEach(function(c){
    var b=BASE.h[c],set=[],del=[],seen={};
    S[c].forEach(function(r){var k=String(r.id);seen[k]=1;if(b[k]!==hr(r))set.push(r)});
    Object.keys(b).forEach(function(k){if(!seen[k])del.push(isNaN(Number(k))?k:Number(k))});
    if(cnt+set.length>limit){set=set.slice(0,Math.max(limit-cnt,0));more=true}
    cnt+=set.length;
    if(cnt+del.length>limit){del=del.slice(0,Math.max(limit-cnt,0));more=true}
    cnt+=del.length;
    if(set.length||del.length)ops[c]={set:set,del:del}});

function applyResp(r){

      if(bh[k]===undefined||ch===bh[k]){S[c]=S[c].map(function(x){return String(x.id)===k?rec:x});l[k]=rec;bh[k]=hs;UI=true}
      else bh[k]=hs});
    ((r.del&&r.del[c])||[]).forEach(function(id){
      var k=String(id),cur=l[k];
      if(cur&&hr(cur)===bh[k]){S[c]=S[c].filter(function(x){return String(x.id)!==k});UI=true}
      delete bh[k]})});
  if(r.cfg){var c2=r.cfg,o={};for(var k in c2)if(k!=='pin'&&k!=='_v')o[k]=c2[k];
    if(c2.pin)S.pin=c2.pin;S.cfg=o;BASE.cv=c2._v;BASE.cfgh=h(JSON.stringify(cfgObj()));UI=true}

async function doSync(){
  if(gate!=='ok'||!CODE)return;

    for(var it=0;it<300;it++){
      var b=buildOps(1000),co=cfgOp(),req={action:'sync',since:BASE.sv,ops:b.ops,last:!b.more,nTk:(S.nTk<100000&&S.nTk>BASE.nk)?S.nTk:0};

      if(!r.ok){if(r.revoked){lockOut();syncing=false;return}throw new Error(r.msg||'ERR')}
      if(r.ver===undefined)throw new Error('OLDSRV');
      if(r.reset){BASE.h={ventas:{},movs:{},turnos:{},prods:{},users:{},tickets:{}};BASE.cv=0;BASE.cfgh='';BASE.sv=0;continue}
      COLS.forEach(function(c){var o=b.ops[c];if(!o)return;o.set.forEach(function(rec){BASE.h[c][String(rec.id)]=hr(rec)});o.del.forEach(function(id){delete BASE.h[c][String(id)]})});

      if(!b.more&&!r.more)break}
    persist();pend=false;lastBk=nowt();setBk('☁ Sincronizado '+lastBk+' ↻');
    if(UI)refresh()
  }catch(e){setBk(syncMsg(e))}

async function init(){
  try{DEV=localStorage.getItem('inv_dev');if(!DEV){DEV='D'+Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem('inv_dev',DEV)}}catch(e){DEV='D0'}
  try{CODE=localStorage.getItem('inv_code')||'';IDX=parseInt(localStorage.getItem('inv_idx')||'0')||0}catch(e){}
  DIDX=IDX||(Math.abs(parseInt(h(DEV).slice(1))||0)%90+10);
  loadBase();
  if(!CODE){gate='no';render();return}
  gate='ok';
  if(!S.pin)$('app').innerHTML='<div id="lock" class="card"><p>Sincronizando…</p></div>';else render();
  try{var r=await api({action:'auth'});if(!r.ok&&r.revoked){lockOut();return}if(r.idx){IDX=r.idx;DIDX=IDX;try{localStorage.setItem('inv_idx',String(IDX))}catch(e){}}}catch(e){}
  await doSync();
  if(!auth)render()}
setInterval(function(){if(gate==='ok'&&CODE&&!document.hidden)doSync()},45000);
if(document.addEventListener){document.addEventListener('visibilitychange',function(){if(!document.hidden&&gate==='ok'&&CODE)doSync()});document.addEventListener('focusout',function(){if(UIpend)setTimeout(refresh,400)})}

/* --- Borrar datos de prueba (solo administrador) --- */
var cf='';
function ask(k){if(role!=='admin')return;if(cf===k){cf='';if(k==='sales')wipeSales();else if(k==='inv')wipeInv();else if(k.charAt(0)==='t')delTurno(Number(k.slice(1)))}else{cf=k;render()}}
function vClean(){
  function b(k,txt){var on=cf===k;return '<button class="btn '+(on?'':'o')+'"'+(on?' style="background:var(--r)"':'')+' onclick="ask(\''+k+'\')">'+(on?'⚠ ¿Seguro? Toca otra vez para borrar':txt)+'</button>'}
  return '<div class="card"><b>🧹 Borrar datos de prueba</b><p class="mu">Se borran en todas las tablets y en tu hoja de Google, y no se puede deshacer. El menú, los meseros y el PIN no se tocan.</p>'+b('sales','Borrar ventas, órdenes y turnos (y reiniciar el # de orden)')+b('inv','Borrar movimientos de inventario')+'</div>'}
function delTurno(id){S.turnos=S.turnos.filter(function(x){return x.id!==id});S.ventas=S.ventas.filter(function(v){return v.turno!==id});if(vt===id)vt=null;save();render();doSync()}
async function wipeSales(){S.ventas=[];S.turnos=[];S.tickets=[];curTk=null;S.nTk=0;S.off=0;vt=null;cart=[];pay=null;rc=null;BASE.nk=0;save();render();try{await api({action:'resetnum'})}catch(e){}doSync()}
function wipeInv(){S.movs=[];save();render();doSync()}
load();norm();hd=vd=today();init();
</script></body></html>
